<text x="44" y="35" class="t">file-integrity</text>
<text x="420" y="35" class="r" text-anchor="end">repo &#8599;</text>
<text x="20" y="70" class="d">Host-based file integrity monitor. Baselines a directory</text><text x="20" y="89" class="d">with SHA-256 hashes, then alerts on modified, added or</text><text x="20" y="108" class="d">deleted files. Standard library only.</text>
