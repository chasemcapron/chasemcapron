name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Classic PAT with no scopes is enough for public data.
          # Add it as a repository secret named METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: chasemcapron
          filename: assets/github-metrics.svg
          template: classic
          config_timezone: America/Chicago
          config_display: large
          config_order: base.header, isocalendar, languages, base.activity+community, base.repositories

          base: header, activity, community, repositories
          base_indepth: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used
